<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1020" />
    <title>Nova Chat</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2356d6b8'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Arial' font-size='30' font-weight='800' fill='%2306111e'%3EN%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="app" class="app">
        <section class="auth-screen" id="authScreen" aria-label="Authentication screen">
            <div class="auth-glow glow-one"></div>
            <div class="auth-glow glow-two"></div>
            <div class="auth-glow glow-three"></div>

            <div class="auth-card">
                <div class="auth-logo" aria-hidden="true">N</div>
                <h1>Nova Chat</h1>
                <p>Private, streaming Gemini conversations synced across your devices.</p>
                <button class="google-btn" id="googleLoginBtn" type="button">
                    <span class="google-icon" aria-hidden="true">G</span>
                    <strong>Continue with Google</strong>
                </button>
                <div class="auth-status" id="authStatus" role="status">Checking auth...</div>
            </div>
        </section>

        <div class="shell" id="shell" hidden>
            <aside class="sidebar" id="sidebar" aria-label="Chat history">
                <div class="sidebar-top">
                    <div class="brand" aria-label="Nova Chat">
                        <span class="brand-mark" aria-hidden="true">N</span>
                        <span class="brand-text">Nova Chat</span>
                    </div>
                    <button class="icon-btn ghost mobile-only" id="closeSidebarBtn" type="button"
                        aria-label="Close sidebar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <button class="new-chat-btn" id="newChatBtn" type="button">
                    <span aria-hidden="true">+</span>
                    New chat
                </button>

                <nav class="chat-list" id="chatList" aria-label="Saved conversations"></nav>

                <div class="profile-card">
                    <div class="profile-avatar" id="userAvatar" aria-hidden="true">N</div>
                    <div class="profile-meta">
                        <strong id="userName">Nova user</strong>
                        <span id="userEmail"></span>
                    </div>
                    <button class="logout-btn" id="logoutBtn" type="button">Logout</button>
                </div>
            </aside>

            <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

            <main class="chat-panel">
                <header class="topbar">
                    <button class="icon-btn" id="sidebarToggleBtn" type="button" aria-label="Toggle sidebar">
                        <span aria-hidden="true">&#9776;</span>
                    </button>

                    <div class="model-meta">
                        <p class="eyebrow">Gemini streaming</p>
                        <h2 id="activeTitle">New chat</h2>
                    </div>

                    <div class="topbar-actions">
                        <span class="status-pill" id="connectionStatus">
                            <span aria-hidden="true"></span>
                            <strong>Ready</strong>
                        </span>
                    </div>
                </header>

                <section class="messages" id="messages" aria-live="polite" aria-label="Conversation messages"></section>

                <form class="composer" id="chatForm" autocomplete="off">
                    <div class="composer-inner">
                        <button class="icon-btn mic-btn" id="micBtn" type="button" aria-label="Start voice input"
                            title="Voice input">
                            <span aria-hidden="true">&#127897;</span>
                        </button>
                        <textarea id="promptInput" rows="1" placeholder="Message Nova Chat..."
                            aria-label="Message Nova Chat"></textarea>
                        <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message" title="Send">
                            <span aria-hidden="true">&#10148;</span>
                        </button>
                    </div>
                    <p class="composer-hint">Enter to send | Shift + Enter for a new line</p>
                </form>
            </main>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
